<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机跳转 · 苹果风格</title>
    <style>
        /* 全局苹果风格设计 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #f2f2f6; /* 苹果系统背景灰 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            /* 确保背景是iOS风格柔光 */
            background-image: radial-gradient(circle at 20% 30%, #ffffff 0%, #f2f2f6 100%);
        }

        /* 卡片容器，模拟iOS设置卡片风格 */
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.02);
            padding: 36px 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
        }

        /* 装饰性图标 / 标题 */
        .icon-container {
            width: 72px;
            height: 72px;
            background: #e8e8ed;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            color: #007aff;
            font-size: 38px;
            box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #1c1c1e;
            margin-bottom: 8px;
            text-align: center;
        }

        .subhead {
            font-size: 15px;
            font-weight: 400;
            color: #8e8e93;
            margin-bottom: 42px;
            text-align: center;
            line-height: 1.4;
            padding: 0 8px;
        }

        /* 主按钮 — 苹果风格圆角按钮 */
        .jump-button {
            width: 100%;
            padding: 18px 24px;
            background: #007aff;
            border: none;
            border-radius: 18px;
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
            /* 增加极细内发光 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 16px;
        }

        /* 按钮按下态 — 模仿 iOS 高亮 */
        .jump-button:active {
            transform: scale(0.97);
            background: #0062cc;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.4);
        }

        /* 微妙的悬停效果 (桌面端) */
        @media (hover: hover) {
            .jump-button:hover {
                background: #1a88ff;
                box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
            }
        }

        /* 辅助说明 */
        .hint {
            font-size: 13px;
            color: #8e8e93;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0.9;
        }

        .hint span {
            background: #e8e8ed;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 12px;
            color: #636366;
        }

        /* 链接预览小标签 (极简装饰) */
        .link-preview {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            opacity: 0.6;
        }

        .link-preview .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #007aff;
            opacity: 0.3;
        }

        /* 确保聚焦无障碍 */
        .jump-button:focus-visible {
            outline: 3px solid rgba(0, 122, 255, 0.5);
            outline-offset: 3px;
        }

        /* 深色模式适配 (跟随系统) */
        @media (prefers-color-scheme: dark) {
            body {
                background: #000000;
                background-image: radial-gradient(circle at 20% 30%, #1c1c1e 0%, #000000 100%);
            }
            .card {
                background: #1c1c1e;
                border-color: rgba(255, 255, 255, 0.05);
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
            }
            h1 {
                color: #ffffff;
            }
            .subhead, .hint {
                color: #98989e;
            }
            .icon-container {
                background: #2c2c2e;
                color: #0a84ff;
            }
            .hint span {
                background: #2c2c2e;
                color: #aeaeb2;
            }
            .jump-button {
                background: #0a84ff;
            }
            .jump-button:active {
                background: #0066d6;
            }
            .link-preview .dot {
                background: #0a84ff;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 简约图标 (类似快捷指令/跳转图标) -->
        <div class="icon-container">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
                <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13 6L19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>精选文章</h1>
        <p class="subhead">精选文章</p>

        <!-- 主按钮 -->
        <button class="jump-button" id="jumpBtn">
            <span>🎲</span>阅读
        </button>


        <div class="hint">
            <span>@ios2026</span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 10 个链接 (示例链接，可随意替换) ----------
            // 为了演示，每个链接都指向一个知名网站或示例页，并带有标识参数
            // 注意: 使用 'https://' 确保跳转安全，同时用 target="_blank" 新标签页打开避免丢失当前页
            // 同时每个链接都添加了 #from-random 或 ?random 等以示区分，但不会影响跳转
            const destinations = [
                'https://mp.weixin.qq.com/s/HxqRRv5AyBZIkbqo7JmmSQ',                     // 1. Apple
                'https://mp.weixin.qq.com/s/bYZYtTIk6tdk6LpSpmAoxA',                    // 2. GitHub
                'https://mp.weixin.qq.com/s/WgZKGy5a0WPdySlL2tku-A',                 // 3. Wikipedia
                'https://mp.weixin.qq.com/s/2S2dDrUiKsnJzID-g9dPOA',                   // 4. YouTube
                'https://mp.weixin.qq.com/s/FdsNmI-POfafix5pUr9YDg',                    // 5. Reddit
                'https://mp.weixin.qq.com/s/HxqRRv5AyBZIkbqo7JmmSQ',                   // 6. 纽约时报
                'https://mp.weixin.qq.com/s/bYZYtTIk6tdk6LpSpmAoxA',                   // 7. Spotify
                'https://mp.weixin.qq.com/s/WgZKGy5a0WPdySlL2tku-A',                     // 8. Figma
                'https://mp.weixin.qq.com/s/2S2dDrUiKsnJzID-g9dPOA',                     // 9. Notion
                'https://mp.weixin.qq.com/s/FdsNmI-POfafix5pUr9YDg'                     // 10. Airbnb
            ];

            // 获取按钮元素
            const jumpBtn = document.getElementById('jumpBtn');

            // 随机选择并跳转
            function jumpToRandomLink() {
                // 生成 0 到 9 的随机整数 (包含0和9)
                const randomIndex = Math.floor(Math.random() * destinations.length);
                const targetUrl = destinations[randomIndex];

                // (可选) 为了更好的用户体验，可以在控制台输出当前跳转的链接，方便调试
                console.log(`🎯 随机跳转到 [${randomIndex + 1}]: ${targetUrl}`);

                // 使用 window.open 在新标签页打开，避免当前页被覆盖 (用户可继续点击按钮)
                // 如果不希望新标签页，可改为 window.location.href = targetUrl; 
                // 但为了符合"跳转"且单页面可再次操作，这里采用新标签页方式。
                // 苹果风格通常保持当前页不丢失，所以用 _blank 更友好。
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
            }

            // 为按钮添加点击事件监听
            jumpBtn.addEventListener('click', jumpToRandomLink);

            // 额外: 添加键盘支持 (按钮默认支持回车/空格, 但确保无障碍)
            jumpBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();  // 防止空格滚动页面
                    jumpToRandomLink();
                }
            });

            // 允许在控制台快速查看链接列表 (可选)
            // window.destinations = destinations;  // 如需调试可取消注释

        })();
    </script>
</body>
</html>
